<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0b1e" />
  <meta name="description" content="A glowing take on 2048. Slide, merge, and reach the 2048 tile." />
  <title>2048</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffd166'/%3E%3Cstop offset='.55' stop-color='%23ff6fa5'/%3E%3Cstop offset='1' stop-color='%23a98bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='63' font-family='Arial,sans-serif' font-weight='700' font-size='34' text-anchor='middle' fill='white'%3E2048%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0b1e;
      --text: #f5f3ff;
      --muted: #aaa4d4;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --slide: 120ms;
      --font: "Fredoka", ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    @media (prefers-reduced-motion: reduce) {
      :root { --slide: 0ms; }
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { min-height: 100%; background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      font-family: var(--font);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* Aurora backdrop + faint dot texture, fixed so iOS doesn't ignore it. */
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }
    body::before {
      background:
        radial-gradient(55vmax 40vmax at 0% 0%, rgba(124, 58, 237, 0.4), transparent 62%),
        radial-gradient(45vmax 38vmax at 100% 6%, rgba(14, 165, 233, 0.26), transparent 60%),
        radial-gradient(60vmax 45vmax at 50% 112%, rgba(236, 72, 153, 0.3), transparent 62%),
        var(--bg);
    }
    body::after {
      background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1.2px);
      background-size: 22px 22px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
      mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
    }

    .app {
      --size: max(280px, min(500px, 92vw, calc(100vh - 290px)));
      width: var(--size);
      padding: clamp(16px, 5vh, 48px) 0 28px;
      container-type: inline-size;
    }
    @supports (height: 100svh) {
      .app { --size: max(280px, min(500px, 92vw, calc(100svh - 290px))); }
    }

    /* ---------- Header ---------- */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      margin: 0;
      font-size: 17cqw;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, #ffe08a 0%, #ffad5c 28%, #ff6fa5 62%, #b48cff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 6px 22px rgba(255, 111, 165, 0.35));
    }

    .scores { display: flex; gap: 8px; }

    .score-box {
      position: relative;
      min-width: 21cqw;
      padding: 8px 14px 9px;
      border-radius: 14px;
      text-align: center;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .score-box .label {
      display: block;
      font-size: clamp(10px, 2.4cqw, 12px);
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .score-box .value {
      display: block;
      font-size: clamp(18px, 5.2cqw, 28px);
      font-weight: 700;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }
    .score-box.bump .value { animation: bump 260ms ease; }

    .score-add {
      position: absolute;
      inset: 38% 0 auto;
      font-size: clamp(14px, 4cqw, 20px);
      font-weight: 700;
      color: #7dffd0;
      text-shadow: 0 0 12px rgba(125, 255, 208, 0.6);
      pointer-events: none;
      animation: score-float 850ms ease-out forwards;
    }

    /* ---------- Toolbar ---------- */
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 3.5cqw 0 4cqw;
    }
    .tagline {
      margin: 0;
      color: var(--muted);
      font-size: clamp(13px, 3.3cqw, 16.5px);
      line-height: 1.35;
    }
    .tagline strong { color: var(--text); font-weight: 600; }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-size: clamp(13px, 3.2cqw, 15px);
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background-color 0.2s ease, opacity 0.2s ease;
    }
    .btn svg { width: 1.15em; height: 1.15em; flex-shrink: 0; }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(1px) scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    .btn-primary {
      background: linear-gradient(135deg, #ff8a5c, #ff4d8d 55%, #b14dff);
      box-shadow: 0 8px 22px -8px rgba(255, 77, 141, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 12px 28px -8px rgba(255, 77, 141, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .btn-ghost {
      background-color: var(--glass);
      border: 1px solid var(--glass-border);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }
    .btn-ghost:hover:not(:disabled) { background-color: rgba(255, 255, 255, 0.11); }

    /* ---------- Board ---------- */
    .board-wrap {
      --gap: 2.8cqw;
      --r-tile: 2.4cqw;
      --r-board: 4.4cqw;
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .board-wrap.nudge { animation: nudge 180ms ease; }

    .board {
      position: absolute;
      inset: 0;
      border-radius: var(--r-board);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.035));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 40px 80px -30px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      backdrop-filter: blur(16px) saturate(1.2);
    }

    .grid,
    .tiles {
      position: absolute;
      inset: var(--gap);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: var(--gap);
    }
    .cell {
      border-radius: var(--r-tile);
      background: rgba(255, 255, 255, 0.055);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.28), inset 0 -1px 0 rgba(255, 255, 255, 0.04);
    }

    .tile {
      --r: 0;
      --c: 0;
      --fs: 11cqw;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      width: calc((100% - 3 * var(--gap)) / 4);
      height: calc((100% - 3 * var(--gap)) / 4);
      transform: translate(calc(var(--c) * (100% + var(--gap))), calc(var(--r) * (100% + var(--gap))));
      transition: transform var(--slide) cubic-bezier(0.3, 0.7, 0.4, 1);
    }
    .tile[data-len="3"] { --fs: 9.4cqw; }
    .tile[data-len="4"] { --fs: 7.6cqw; }
    .tile[data-len="5"] { --fs: 6.2cqw; }
    .tile[data-len="6"] { --fs: 5.2cqw; }
    .tile[data-len="7"] { --fs: 4.4cqw; }
    .tile.is-source { z-index: 2; }
    .tile.is-merged { z-index: 3; }

    /* Outer .tile owns position (transition); inner owns scale (animations). */
    .tile-inner {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: var(--r-tile);
      background: var(--bg-tile);
      color: var(--fg, #fff);
      font-size: var(--fs);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--ts, 0 2px 6px rgba(0, 0, 0, 0.22));
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.4),
        inset 0 -3px 0 rgba(0, 0, 0, 0.12),
        0 8px 18px -8px rgba(0, 0, 0, 0.55),
        0 0 var(--glow-size, 12px) var(--glow, transparent);
    }
    .tile.is-new .tile-inner { animation: appear 200ms cubic-bezier(0.34, 1.56, 0.64, 1) var(--slide) backwards; }
    .tile.is-merged .tile-inner { animation: pop 240ms ease var(--slide) backwards; }

    .t2    { --bg-tile: linear-gradient(145deg, #fbfaff, #e4e1fb); --fg: #3d3566; --ts: none; }
    .t4    { --bg-tile: linear-gradient(145deg, #eef8ff, #c8e5fb); --fg: #22466a; --ts: none; }
    .t8    { --bg-tile: linear-gradient(145deg, #5eead4, #0fb5a2); --glow: rgba(20, 184, 166, 0.35); }
    .t16   { --bg-tile: linear-gradient(145deg, #6fb6ff, #3a7bf5); --glow: rgba(59, 130, 246, 0.38); }
    .t32   { --bg-tile: linear-gradient(145deg, #a98bff, #7037e8); --glow: rgba(124, 58, 237, 0.42); }
    .t64   { --bg-tile: linear-gradient(145deg, #ff86c4, #dc2a7a); --glow: rgba(236, 72, 153, 0.45); }
    .t128  { --bg-tile: linear-gradient(145deg, #ffa25e, #ef5a12); --glow: rgba(249, 115, 22, 0.5); --glow-size: 16px; }
    .t256  { --bg-tile: linear-gradient(145deg, #ff7d7d, #df2a3a); --glow: rgba(239, 68, 68, 0.5); --glow-size: 20px; }
    .t512  { --bg-tile: linear-gradient(145deg, #ffc94d, #e8890c); --glow: rgba(245, 158, 11, 0.55); --glow-size: 24px; }
    .t1024 { --bg-tile: linear-gradient(145deg, #ffd84a, #d99a06); --glow: rgba(250, 204, 21, 0.6); --glow-size: 28px; }
    .t2048 { --bg-tile: transparent; --glow: rgba(255, 196, 90, 0.75); --glow-size: 34px; }
    .tile-super {
      --bg-tile: radial-gradient(circle at 30% 20%, #3d3290, #120f2b 72%);
      --fg: #ffd76a;
      --ts: 0 0 14px rgba(255, 215, 106, 0.55);
      --glow: rgba(167, 139, 250, 0.6);
      --glow-size: 30px;
    }
    .tile-super .tile-inner { outline: 2px solid rgba(255, 215, 106, 0.55); outline-offset: -2px; }

    /* 2048: shifting rainbow-gold surface with a periodic sheen. */
    .t2048 .tile-inner::before,
    .t2048 .tile-inner::after,
    .tile-super .tile-inner::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
    }
    .t2048 .tile-inner::before {
      background: linear-gradient(120deg, #ffe38a, #ffb43d, #ff6fa5, #b48cff, #ffe38a);
      background-size: 300% 100%;
      animation: shimmer 6s linear infinite;
    }
    .t2048 .tile-inner::after,
    .tile-super .tile-inner::after {
      background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, 0.5) 50%, transparent 65%);
      background-size: 250% 100%;
      animation: sheen 3.2s ease-in-out infinite;
    }
    .tile-super .tile-inner::after { opacity: 0.35; }

    /* ---------- Overlay ---------- */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 6cqw;
      text-align: center;
      border-radius: var(--r-board);
      background: rgba(13, 11, 30, 0.58);
      -webkit-backdrop-filter: blur(7px) saturate(1.3);
      backdrop-filter: blur(7px) saturate(1.3);
      animation: fade-in 450ms ease both;
    }
    .overlay-card { animation: rise 520ms cubic-bezier(0.2, 0.9, 0.3, 1.15) 80ms both; }
    .overlay-badge {
      display: grid;
      place-items: center;
      width: 15cqw;
      height: 15cqw;
      margin: 0 auto 3cqw;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffe08a, #ff6fa5 60%, #b48cff);
      box-shadow: 0 10px 30px -6px rgba(255, 111, 165, 0.7), inset 0 2px 0 rgba(255, 255, 255, 0.5);
    }
    .overlay-badge svg { width: 55%; height: 55%; }
    .overlay.lose .overlay-badge { display: none; }
    .overlay h2 {
      margin: 0 0 2.5cqw;
      font-size: 12.5cqw;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .overlay.win h2 {
      background: linear-gradient(120deg, #ffe08a, #ffad5c 35%, #ff6fa5 70%, #b48cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .overlay p {
      max-width: 30ch;
      margin: 0 auto 5cqw;
      color: #d8d3f7;
      font-size: clamp(14px, 3.6cqw, 18px);
      line-height: 1.45;
    }
    .overlay-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .overlay .btn { padding: 12px 20px; }

    /* ---------- Help ---------- */
    .help {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 5cqw;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--muted);
      font-size: clamp(13px, 3.1cqw, 15px);
      line-height: 1.5;
    }
    .help p { margin: 0; }
    .help b, .help strong { color: var(--text); font-weight: 600; }

    .keys {
      display: grid;
      grid-template-columns: repeat(3, 26px);
      grid-template-rows: repeat(2, 26px);
      gap: 4px;
      flex-shrink: 0;
    }
    .key, kbd {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-bottom-width: 3px;
    }
    .key { display: grid; place-items: center; border-radius: 7px; }
    .key svg { width: 12px; height: 12px; }
    .k-up { grid-column: 2; }
    .k-left { grid-column: 1; grid-row: 2; }
    .k-down { grid-column: 2; grid-row: 2; }
    .k-right { grid-column: 3; grid-row: 2; }

    .foot {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 18px;
      margin-top: 16px;
      color: rgba(170, 164, 212, 0.7);
      font-size: 12.5px;
    }
    kbd {
      margin-right: 4px;
      padding: 1px 6px;
      border-radius: 6px;
      border-bottom-width: 2px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
    }

    @media (hover: none) and (pointer: coarse) {
      .keys, .foot .kb { display: none; }
    }

    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      pointer-events: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* ---------- Keyframes ---------- */
    @keyframes appear {
      from { transform: scale(0.2); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      40% { opacity: 1; }
      50% { transform: scale(1.16); }
      100% { transform: scale(1); }
    }
    @keyframes nudge {
      40% { transform: translate(var(--nx, 0), var(--ny, 0)); }
    }
    @keyframes bump {
      50% { transform: scale(1.12); }
    }
    @keyframes score-float {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-38px); }
    }
    @keyframes shimmer {
      to { background-position: 300% 0; }
    }
    @keyframes sheen {
      0% { background-position: 100% 0; }
      55%, 100% { background-position: 0% 0; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(0.96); }
    }

    @media (prefers-reduced-motion: reduce) {
      .tile, .btn { transition: none; }
      .tile-inner, .tile-inner::before, .tile-inner::after,
      .overlay, .overlay-card, .board-wrap, .score-box .value {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 class="logo">2048</h1>
      <div class="scores">
        <div class="score-box" id="score-box">
          <span class="label">Score</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="score-box" id="best-box">
          <span class="label">Best</span>
          <span class="value" id="best">0</span>
        </div>
      </div>
    </header>

    <div class="bar">
      <p class="tagline">Join the tiles, get to <strong>2048!</strong></p>
      <div class="actions">
        <button class="btn btn-ghost" id="undo" type="button" title="Undo (U)" aria-label="Undo last move">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
          <span>Undo</span>
        </button>
        <button class="btn btn-primary" id="new-game" type="button" title="New game (N)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
          <span>New Game</span>
        </button>
      </div>
    </div>

    <div class="board-wrap" id="board-wrap">
      <div class="board" aria-label="Game board">
        <div class="grid" aria-hidden="true">
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
        <div class="tiles" id="tiles"></div>
      </div>

      <div class="overlay" id="overlay" role="dialog" aria-labelledby="overlay-title" hidden>
        <div class="overlay-card">
          <div class="overlay-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" /></svg>
          </div>
          <h2 id="overlay-title"></h2>
          <p id="overlay-text"></p>
          <div class="overlay-actions">
            <button class="btn btn-ghost" id="overlay-secondary" type="button"></button>
            <button class="btn btn-primary" id="overlay-primary" type="button"></button>
          </div>
        </div>
      </div>
    </div>

    <section class="help">
      <div class="keys" aria-hidden="true">
        <span class="key k-up"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M6 2.5 10 9H2z" /></svg></span>
        <span class="key k-left"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M2.5 6 9 2v8z" /></svg></span>
        <span class="key k-down"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M6 9.5 2 3h8z" /></svg></span>
        <span class="key k-right"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M9.5 6 3 10V2z" /></svg></span>
      </div>
      <p><strong>How to play:</strong> use the <b>arrow keys</b>, <b>WASD</b>, or <b>swipe</b> to slide every tile. When two tiles with the same number touch, they <b>merge into one</b>. Reach <b>2048</b> to win!</p>
    </section>

    <footer class="foot">
      <span class="kb"><kbd>U</kbd>Undo</span>
      <span class="kb"><kbd>N</kbd>New game</span>
      <span>Based on 2048 by Gabriele Cirulli</span>
    </footer>

    <div class="sr-only" id="live" aria-live="polite"></div>
  </main>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script>
  (() => {
    "use strict";

    const SIZE = 4;
    const WIN_VALUE = 2048;
    const POP_MS = 240;
    const HISTORY_LIMIT = 100;
    const SAVED_HISTORY = 30;
    const STATE_KEY = "aurora2048.state";
    const BEST_KEY = "aurora2048.best";

    const motion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const slideMs = () => (motion.matches ? 0 : 120);

    const $ = (id) => document.getElementById(id);
    const ui = {
      tiles: $("tiles"),
      wrap: $("board-wrap"),
      score: $("score"),
      best: $("best"),
      scoreBox: $("score-box"),
      bestBox: $("best-box"),
      undo: $("undo"),
      newGame: $("new-game"),
      overlay: $("overlay"),
      overlayTitle: $("overlay-title"),
      overlayText: $("overlay-text"),
      overlayPrimary: $("overlay-primary"),
      overlaySecondary: $("overlay-secondary"),
      live: $("live"),
    };

    const store = {
      get(key) {
        try { return localStorage.getItem(key); } catch { return null; }
      },
      set(key, value) {
        try { localStorage.setItem(key, value); } catch { /* storage unavailable (e.g. private mode) */ }
      },
    };

    let grid = [];
    let score = 0;
    let best = Number(store.get(BEST_KEY)) || 0;
    let won = false;
    let keepPlaying = false;
    let over = false;
    let history = [];
    let nextId = 1;

    const tileEls = new Map();
    let leaving = [];
    let overlayTimer = 0;

    const VECTORS = {
      up: { r: -1, c: 0 },
      down: { r: 1, c: 0 },
      left: { r: 0, c: -1 },
      right: { r: 0, c: 1 },
    };

    const fmt = (n) => n.toLocaleString();
    const emptyGrid = () => Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    const makeTile = (value, r, c) => ({ id: nextId++, value, r, c });
    const inBounds = (r, c) => r >= 0 && r < SIZE && c >= 0 && c < SIZE;

    function eachTile(fn) {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c]) fn(grid[r][c]);
        }
      }
    }

    function spawnTile() {
      const empty = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (!grid[r][c]) empty.push([r, c]);
        }
      }
      if (!empty.length) return null;
      const [r, c] = empty[Math.floor(Math.random() * empty.length)];
      const tile = makeTile(Math.random() < 0.9 ? 2 : 4, r, c);
      grid[r][c] = tile;
      return tile;
    }

    function movesAvailable() {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const t = grid[r][c];
          if (!t) return true;
          if (c + 1 < SIZE && grid[r][c + 1]?.value === t.value) return true;
          if (r + 1 < SIZE && grid[r + 1][c]?.value === t.value) return true;
        }
      }
      return false;
    }

    // ---------- State ----------
    const snapshot = () => ({
      cells: grid.map((row) => row.map((t) => (t ? t.value : 0))),
      score,
      won,
      keepPlaying,
    });

    function restore(state) {
      grid = emptyGrid();
      state.cells.forEach((row, r) =>
        row.forEach((value, c) => {
          if (value) grid[r][c] = makeTile(value, r, c);
        })
      );
      score = state.score;
      won = Boolean(state.won);
      keepPlaying = Boolean(state.keepPlaying);
      over = !movesAvailable();
    }

    const isValidState = (s) =>
      s &&
      Array.isArray(s.cells) &&
      s.cells.length === SIZE &&
      s.cells.every((row) => Array.isArray(row) && row.length === SIZE && row.every((v) => Number.isInteger(v) && v >= 0)) &&
      s.cells.some((row) => row.some((v) => v > 0)) &&
      Number.isFinite(s.score);

    function save() {
      store.set(STATE_KEY, JSON.stringify({ ...snapshot(), history: history.slice(-SAVED_HISTORY) }));
    }

    function load() {
      try {
        const state = JSON.parse(store.get(STATE_KEY));
        if (!isValidState(state)) return false;
        restore(state);
        history = Array.isArray(state.history) ? state.history.filter(isValidState) : [];
        best = Math.max(best, score);
        return true;
      } catch {
        return false;
      }
    }

    // ---------- Game actions ----------
    function move(dir) {
      if (over || (won && !keepPlaying)) return;

      const v = VECTORS[dir];
      const before = snapshot();
      const rows = [0, 1, 2, 3];
      const cols = [0, 1, 2, 3];
      if (v.r === 1) rows.reverse();
      if (v.c === 1) cols.reverse();

      const moved = [];
      const merges = [];
      const mergedThisTurn = new Set();
      let gained = 0;

      for (const r of rows) {
        for (const c of cols) {
          const tile = grid[r][c];
          if (!tile) continue;

          let nr = r;
          let nc = c;
          let target = null;
          while (inBounds(nr + v.r, nc + v.c)) {
            const next = grid[nr + v.r][nc + v.c];
            if (!next) {
              nr += v.r;
              nc += v.c;
              continue;
            }
            if (next.value === tile.value && !mergedThisTurn.has(next)) target = next;
            break;
          }

          if (target) {
            const merged = makeTile(tile.value * 2, target.r, target.c);
            grid[r][c] = null;
            grid[merged.r][merged.c] = merged;
            mergedThisTurn.add(merged);
            tile.r = merged.r;
            tile.c = merged.c;
            merges.push({ tile: merged, from: [target, tile] });
            gained += merged.value;
          } else if (nr !== r || nc !== c) {
            grid[r][c] = null;
            grid[nr][nc] = tile;
            tile.r = nr;
            tile.c = nc;
            moved.push(tile);
          }
        }
      }

      if (!moved.length && !merges.length) {
        nudge(v);
        return;
      }

      history.push(before);
      if (history.length > HISTORY_LIMIT) history.shift();

      score += gained;
      const newBest = score > best;
      if (newBest) {
        best = score;
        store.set(BEST_KEY, String(best));
      }

      const spawned = spawnTile();
      const justWon = !won && merges.some((m) => m.tile.value === WIN_VALUE);
      if (justWon) won = true;
      over = !movesAvailable();

      renderMove(moved, merges, spawned);
      updateScore(gained, newBest);
      updateUndo();
      save();

      if (justWon) showOverlay("win", { delay: slideMs() + 350, celebrate: true });
      else if (over) showOverlay("lose", { delay: 900 });
    }

    function newGame() {
      // Keep the abandoned game undoable so an accidental "N" isn't fatal.
      history = grid.length && !over && score > 0 ? [snapshot()] : [];
      grid = emptyGrid();
      score = 0;
      won = false;
      keepPlaying = false;
      over = false;
      spawnTile();
      spawnTile();
      hideOverlay();
      renderAll(true);
      updateScore();
      updateUndo();
      save();
    }

    function undo() {
      if (!history.length) return;
      restore(history.pop());
      renderAll(false);
      updateScore();
      updateUndo();
      save();
      syncOverlay();
    }

    function keepGoing() {
      keepPlaying = true;
      hideOverlay();
      save();
      if (over) showOverlay("lose", { delay: 250 });
    }

    // ---------- Rendering ----------
    function setPos(el, tile) {
      el.style.setProperty("--r", tile.r);
      el.style.setProperty("--c", tile.c);
    }

    function addTileEl(tile, cls) {
      const el = document.createElement("div");
      el.className = `tile ${tile.value > WIN_VALUE ? "tile-super" : "t" + tile.value}${cls ? " " + cls : ""}`;
      el.dataset.len = String(tile.value).length;
      setPos(el, tile);
      const inner = document.createElement("div");
      inner.className = "tile-inner";
      inner.textContent = tile.value;
      el.appendChild(inner);
      ui.tiles.appendChild(el);
      tileEls.set(tile.id, el);
    }

    // Finish any in-flight animations so rapid input never stacks stale tiles.
    function settle() {
      leaving.forEach((el) => el.remove());
      leaving = [];
      tileEls.forEach((el) => el.classList.remove("is-new", "is-merged", "is-source"));
    }

    function renderMove(moved, merges, spawned) {
      settle();
      for (const tile of moved) {
        const el = tileEls.get(tile.id);
        if (el) setPos(el, tile);
      }
      for (const { tile, from } of merges) {
        for (const src of from) {
          const el = tileEls.get(src.id);
          if (!el) continue;
          tileEls.delete(src.id);
          el.classList.add("is-source");
          setPos(el, src);
          leaving.push(el);
        }
        addTileEl(tile, "is-merged");
      }
      if (spawned) addTileEl(spawned, "is-new");

      const batch = leaving.slice();
      setTimeout(() => {
        batch.forEach((el) => el.remove());
        leaving = leaving.filter((el) => !batch.includes(el));
      }, slideMs() + POP_MS);
    }

    function renderAll(animate) {
      leaving = [];
      tileEls.clear();
      ui.tiles.replaceChildren();
      eachTile((tile) => addTileEl(tile, animate ? "is-new" : ""));
    }

    function restartClass(el, cls) {
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
    }

    function updateScore(gained = 0, newBest = false) {
      ui.score.textContent = fmt(score);
      ui.best.textContent = fmt(best);
      if (gained > 0 && !motion.matches) {
        const add = document.createElement("span");
        add.className = "score-add";
        add.textContent = `+${gained}`;
        add.addEventListener("animationend", () => add.remove());
        ui.scoreBox.appendChild(add);
        restartClass(ui.scoreBox, "bump");
        if (newBest) restartClass(ui.bestBox, "bump");
      }
    }

    function updateUndo() {
      ui.undo.disabled = history.length === 0;
    }

    function nudge(v) {
      if (motion.matches) return;
      ui.wrap.style.setProperty("--nx", `${v.c * 6}px`);
      ui.wrap.style.setProperty("--ny", `${v.r * 6}px`);
      restartClass(ui.wrap, "nudge");
    }

    // ---------- Overlay ----------
    const overlayActions = { newGame, undo, keepGoing };

    function showOverlay(kind, { delay = 0, celebrate = false } = {}) {
      clearTimeout(overlayTimer);
      overlayTimer = setTimeout(() => {
        const win = kind === "win";
        ui.overlay.className = `overlay ${kind}`;
        ui.overlayTitle.textContent = win ? "You win!" : "Game over";
        ui.overlayText.textContent = win
          ? `You reached 2048 with ${fmt(score)} points. Keep going for an even bigger tile?`
          : `No moves left. Final score: ${fmt(score)}.${score > 0 && score >= best ? " That's your best yet!" : ""}`;
        ui.overlayPrimary.textContent = win ? "Keep going" : "Try again";
        ui.overlayPrimary.dataset.action = win ? "keepGoing" : "newGame";
        ui.overlaySecondary.textContent = win ? "New game" : "Undo";
        ui.overlaySecondary.dataset.action = win ? "newGame" : "undo";
        ui.overlaySecondary.hidden = !win && history.length === 0;
        ui.overlay.hidden = false;
        ui.live.textContent = `${ui.overlayTitle.textContent} ${ui.overlayText.textContent}`;
        ui.overlayPrimary.focus({ preventScroll: true });
        if (celebrate) confetti.burst();
      }, delay);
    }

    function hideOverlay() {
      clearTimeout(overlayTimer);
      ui.overlay.hidden = true;
    }

    function syncOverlay() {
      if (won && !keepPlaying) showOverlay("win");
      else if (over) showOverlay("lose");
      else hideOverlay();
    }

    // ---------- Confetti ----------
    const confetti = (() => {
      const canvas = $("confetti");
      const ctx = canvas.getContext("2d");
      const colors = ["#ffe08a", "#ffad5c", "#ff6fa5", "#b48cff", "#5eead4", "#6fb6ff", "#ffffff"];
      let pieces = [];
      let frame = 0;
      let last = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = innerWidth * dpr;
        canvas.height = innerHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function burst() {
        if (motion.matches) return;
        resize();
        const rect = ui.wrap.getBoundingClientRect();
        const ox = rect.left + rect.width / 2;
        const oy = rect.top + rect.height * 0.4;
        for (let i = 0; i < 170; i++) {
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.95;
          const speed = 8 + Math.random() * 11;
          pieces.push({
            x: ox + (Math.random() - 0.5) * rect.width * 0.3,
            y: oy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            w: 6 + Math.random() * 6,
            h: 9 + Math.random() * 8,
            rot: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 0.35,
            tilt: Math.random() * Math.PI * 2,
            color: colors[(Math.random() * colors.length) | 0],
          });
        }
        if (!frame) {
          last = performance.now();
          frame = requestAnimationFrame(tick);
        }
      }

      function tick(now) {
        const dt = Math.min((now - last) / 16.67, 3);
        const drag = Math.pow(0.985, dt);
        last = now;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (const p of pieces) {
          p.vy += 0.32 * dt;
          p.vx *= drag;
          p.vy *= drag;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.rot += p.spin * dt;
          p.tilt += 0.12 * dt;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.scale(1, Math.cos(p.tilt));
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        pieces = pieces.filter((p) => p.y < innerHeight + 40);
        if (pieces.length) {
          frame = requestAnimationFrame(tick);
        } else {
          frame = 0;
          ctx.clearRect(0, 0, innerWidth, innerHeight);
        }
      }

      return { burst };
    })();

    // ---------- Input ----------
    const KEYS = {
      ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
      w: "up", s: "down", a: "left", d: "right",
    };

    document.addEventListener("keydown", (e) => {
      if (e.altKey) return;
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (e.ctrlKey || e.metaKey) {
        if (key === "z") {
          e.preventDefault();
          undo();
        }
        return;
      }
      if (KEYS[key]) {
        e.preventDefault();
        move(KEYS[key]);
      } else if (key === "u" || key === "z") {
        undo();
      } else if (key === "n") {
        newGame();
      }
    });

    let swipe = null;
    ui.wrap.addEventListener("pointerdown", (e) => {
      if (!e.isPrimary || e.button > 0) return;
      swipe = { x: e.clientX, y: e.clientY, id: e.pointerId };
    });
    window.addEventListener("pointerup", (e) => {
      if (!swipe || e.pointerId !== swipe.id) return;
      const dx = e.clientX - swipe.x;
      const dy = e.clientY - swipe.y;
      swipe = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    });
    window.addEventListener("pointercancel", () => { swipe = null; });

    ui.newGame.addEventListener("click", newGame);
    ui.undo.addEventListener("click", undo);
    for (const btn of [ui.overlayPrimary, ui.overlaySecondary]) {
      btn.addEventListener("click", () => overlayActions[btn.dataset.action]?.());
    }

    // ---------- Boot ----------
    if (load()) {
      renderAll(true);
      updateScore();
      updateUndo();
      syncOverlay();
    } else {
      newGame();
    }
  })();
  </script>
</body>
</html>
